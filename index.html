<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appréciations Collège Luqman</title>
<style>
:root{--v:#1a7a6e;--vd:#145f55;--o:#e8671a;--bg:#f0f2f0;--w:#fff;--b:#dde8e6;--t:#1a1a1a;--m:#5a7570}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
.hdr{background:var(--v);padding:14px 16px}
.hdr h1{font-size:19px;font-weight:700;color:#fff}
.bod{padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:8px;border:1.5px solid var(--b);background:var(--w);font-size:14px;cursor:pointer;color:var(--m);flex:1;text-align:center}
.tab.on{background:var(--v);color:#fff;border-color:var(--v);font-weight:600}
.sec{display:none}.sec.on{display:block}
.card{background:var(--w);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.sl{font-size:11px;font-weight:700;color:var(--v);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.chip{padding:5px 11px;border-radius:99px;border:1.5px solid var(--b);background:var(--w);font-size:13px;cursor:pointer;color:var(--m);user-select:none}
.chip.gen.on,.chip.pos.on,.chip.prog.on{background:#e6f4f1;color:var(--vd);border-color:var(--v)}
.chip.neg.on{background:#FCEBEB;color:#A32D2D;border-color:#F09595}
.chip.comp.on{background:#fef0e6;color:#7a3a0a;border-color:var(--o)}
.chip.sport.on{background:#e8f0fe;color:#1a56a0;border-color:#4a80d4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{font-size:13px;color:var(--m);display:block;margin-bottom:4px}
input,select{width:100%;font-size:14px;padding:8px 10px;border:1.5px solid var(--b);border-radius:8px;background:var(--w);color:var(--t)}
input:focus,select:focus{outline:none;border-color:var(--v)}
.gr{display:flex;gap:8px}
.grb{padding:7px 14px;border-radius:99px;border:1.5px solid var(--b);background:var(--w);font-size:13px;cursor:pointer;color:var(--m)}
.grb.on{background:var(--v);color:#fff;border-color:var(--v);font-weight:600}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.a{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--b);background:var(--w);font-size:13px;cursor:pointer;color:var(--t)}
button.a:hover{background:#f0f7f6}
button.a.p{background:var(--o);border-color:var(--o);color:#fff;font-weight:600}
button.a.p:hover{background:#d45e15}
.rb{background:#f4faf9;border:1.5px solid var(--v);border-radius:10px;padding:13px;margin-top:10px}
.rt{font-size:14px;line-height:1.75;min-height:44px;white-space:pre-wrap}
.stag{font-size:12px;padding:2px 8px;border-radius:99px;background:#e6f4f1;color:var(--vd);border:1px solid var(--v);display:inline-block;margin:2px}
.stags{display:flex;flex-wrap:wrap;margin:6px 0 2px;min-height:20px}
hr{border:none;border-top:1px solid var(--b);margin:12px 0}
.ei{display:flex;align-items:flex-start;gap:8px;padding:10px 11px;background:var(--w);border:1px solid var(--b);border-radius:8px;margin-bottom:8px}
.ein{flex:1;min-width:0}
.en{font-size:14px;font-weight:600;color:var(--vd)}
.em{font-size:12px;color:var(--m);margin-top:2px}
.ep{font-size:13px;line-height:1.55;margin-top:5px}
.ib{padding:5px 9px;font-size:12px;border-radius:7px;border:1px solid var(--b);background:var(--w);cursor:pointer;color:var(--m)}
.ib:hover{background:#f0f7f6}
.ib.d:hover{background:#FCEBEB;color:#A32D2D}
.emp{font-size:13px;color:var(--m);font-style:italic;padding:10px 0}
.fb{padding:5px 11px;border-radius:99px;border:1.5px solid var(--b);background:var(--w);font-size:13px;cursor:pointer;color:var(--m)}
.fb.on{background:var(--v);color:#fff;border-color:var(--v);font-weight:600}
.fr{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fs{font-size:13px;padding:5px 8px;border:1px solid #ccc;border-radius:8px;background:#fff;width:auto}
.cnt{font-size:12px;color:var(--m);margin-left:auto}
.ok{background:#e6f4f1;color:var(--vd);border:1px solid var(--v);border-radius:8px;padding:8px 11px;font-size:13px;margin-top:9px;display:none}
.ebox{background:#f4faf9;border:1px solid var(--b);border-radius:10px;padding:11px;font-size:13px;line-height:1.85;white-space:pre-wrap;min-height:50px}
.ml{font-size:12px;color:var(--m);font-style:italic;display:block;margin-top:4px}
@media(max-width:400px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr"><h1>📋 Appréciations Collège Luqman</h1></div>
<div class="bod">
<div class="tabs">
  <button class="tab on" onclick="setTab('gen')">✦ Générer</button>
  <button class="tab" onclick="setTab('lst')">👥 Élèves <span id="bdg"></span></button>
  <button class="tab" onclick="setTab('exp')">↗ Export</button>
</div>

<div id="gen" class="sec on"><div class="card">
  <div class="g2">
    <div><label>Prénom</label><input type="text" id="prenom" placeholder="Ex: Lucas"></div>
    <div><label>Classe</label><select id="classe" onchange="onClasse()"><option>6e</option><option>5e</option><option>4e</option><option>3e</option></select></div>
  </div>
  <div class="g2">
    <div><label>Matière</label><select id="matiere" onchange="onMatiere()">
      <option>Français</option><option>Maths</option><option>Anglais</option><option>Arabe</option>
      <option>Histoire-Géo/EMC</option><option>SVT</option><option>Physique-Chimie</option>
      <option>Arts Plastiques</option><option>Éducation Musicale</option><option>EPS</option>
    </select></div>
    <div><label>Genre</label><div class="gr"><button class="grb on" id="gm" onclick="setG('M')">Garçon</button><button class="grb" id="gf" onclick="setG('F')">Fille</button></div></div>
  </div>
  <div class="g2">
    <div><label>Moyenne <span style="font-weight:400;color:var(--m)">(optionnelle /20)</span></label>
      <input type="number" id="moyenne" min="0" max="20" step="0.5" placeholder="Ex: 13.5" oninput="onMoy()">
      <span class="ml" id="moy-lbl"></span>
    </div>
    <div><label>Trimestre</label><select id="trim_sel" onchange="onMoy()">
      <option value="">Non précisé</option>
      <option value="T1">T1 — Début d'année</option>
      <option value="T2">T2 — Milieu d'année</option>
      <option value="T3">T3 — Fin d'année</option>
    </select></div>
  </div>

  <div class="sl">Général — toutes matières</div><div class="chips" id="cp-gen"></div>
  <div class="sl" id="lpos">Points positifs</div><div class="chips" id="cp-pos"></div>
  <div class="sl" id="lneg">Points à travailler</div><div class="chips" id="cp-neg"></div>
  <div class="sl" id="lsport" style="display:none">Sports — EPS</div><div class="chips" id="cp-sport" style="display:none"></div>
  <div class="sl">Comportement</div><div class="chips" id="cp-comp"></div>
  <div class="sl">Progression</div><div class="chips" id="cp-prog"></div>
  <hr>
  <div style="margin-bottom:10px">
    <label>Mots libres <span style="font-weight:400;color:var(--m)">(sport, contexte… virgules)</span></label>
    <input type="text" id="free" placeholder="Ex: ULIS, allophone…" oninput="renderTags()">
  </div>
  <div style="font-size:12px;color:var(--m);margin-bottom:3px">Mots-clés sélectionnés :</div>
  <div class="stags" id="stags"><span style="font-size:12px;color:#aaa;font-style:italic">Aucun</span></div>
  <div class="brow">
    <button class="a p" onclick="generer()">⚡ Générer</button>
    <button class="a" onclick="regenerer()">↺ Regénérer</button>
    <button class="a" onclick="resetForm()">✕ Réinitialiser</button>
  </div>
  <div id="rz" style="display:none" class="rb">
    <div style="font-size:12px;color:var(--m);margin-bottom:5px" id="rl">Phrase générée</div>
    <div id="rt" class="rt"></div>
    <div class="brow">
      <button class="a p" onclick="enregistrer()">💾 Enregistrer</button>
      <button class="a" onclick="copierPhrase()">⎘ Copier</button>
    </div>
    <div class="ok" id="ok">✓ Enregistré !</div>
  </div>
</div></div>

<div id="lst" class="sec">
  <div class="fr">
    <button class="fb on" onclick="filtrer('toutes',this)">Toutes</button>
    <button class="fb" onclick="filtrer('6e',this)">6e</button>
    <button class="fb" onclick="filtrer('5e',this)">5e</button>
    <button class="fb" onclick="filtrer('4e',this)">4e</button>
    <button class="fb" onclick="filtrer('3e',this)">3e</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="fr">
    <select class="fs" id="fm" onchange="renderListe()"><option value="t">Toutes matières</option><option>Français</option><option>Maths</option><option>Anglais</option><option>Arabe</option><option>Espagnol</option><option>Histoire-Géo/EMC</option><option>SVT</option><option>Physique-Chimie</option><option>Technologie</option><option>Arts Plastiques</option><option>Éducation Musicale</option><option>EPS</option></select>
    <select class="fs" id="ft" onchange="renderListe()"><option value="t">Tous trimestres</option><option value="T1">T1</option><option value="T2">T2</option><option value="T3">T3</option></select>
    <select class="fs" id="fa" onchange="renderListe()"><option value="t">Toutes années</option></select>
  </div>
  <div id="elist"></div>
</div>

<div id="exp" class="sec">
  <div class="fr">
    <select class="fs" id="ecl" onchange="renderExp()"><option value="t">Toutes classes</option><option>6e</option><option>5e</option><option>4e</option><option>3e</option></select>
    <select class="fs" id="emat" onchange="renderExp()"><option value="t">Toutes matières</option><option>Français</option><option>Maths</option><option>Anglais</option><option>Arabe</option><option>Espagnol</option><option>Histoire-Géo/EMC</option><option>SVT</option><option>Physique-Chimie</option><option>Technologie</option><option>Arts Plastiques</option><option>Éducation Musicale</option><option>EPS</option></select>
    <select class="fs" id="etr" onchange="renderExp()"><option value="t">Tous trimestres</option><option value="T1">T1</option><option value="T2">T2</option><option value="T3">T3</option></select>
    <select class="fs" id="ean" onchange="renderExp()"><option value="t">Toutes années</option></select>
    <button class="a" style="margin-left:auto" onclick="copierExp()">⎘ Copier</button>
  </div>
  <div id="ecnt" class="ebox">Aucune appréciation.</div>
</div>
</div>

function onClasse() {
  var cl = document.getElementById("classe").value;
  var liste = cl === "6e" ? M6 : M5;
  var s = document.getElementById("matiere");
  var cur = s.value;
  s.innerHTML = liste.map(function(m){return "<option"+(m===cur?" selected":"")+">"+m+"</option>";}).join("");
  onMatiere();
}

function onMatiere() {
  var mat = document.getElementById("matiere").value;
  matCur = mat;
  var data = MAT[mat] || MAT["EPS"];
  var valid = {};
  data.pos.concat(data.neg).forEach(function(c){valid[c.k]=1;});
  Object.keys(sel).forEach(function(k){if((sel[k]==="pos"||sel[k]==="neg")&&!valid[k])delete sel[k];});
  if(sel) Object.keys(sel).forEach(function(k){if(sel[k]==="sport"&&mat!=="EPS")delete sel[k];});
  document.getElementById("lpos").textContent = "Points positifs — " + mat;
  document.getElementById("lneg").textContent = "Points à travailler — " + mat;
  var showSport = mat === "EPS";
  document.getElementById("lsport").style.display = showSport ? "" : "none";
  document.getElementById("cp-sport").style.display = showSport ? "" : "none";
  renderAll();
}

function setG(g) {
  genre = g;
  document.getElementById("gm").classList.toggle("on", g==="M");
  document.getElementById("gf").classList.toggle("on", g==="F");
}

function allChipsList() {
  var r = [].concat(GEN, COMP, PROG);
  var d = MAT[matCur] || MAT["EPS"];
  r = r.concat(d.pos, d.neg);
  if (d.sports) r = r.concat(d.sports);
  return r;
}

function renderAll() {
  var mat = document.getElementById("matiere").value || "EPS";
  var data = MAT[mat] || MAT["EPS"];
  var cats = {gen:GEN, pos:data.pos, neg:data.neg, comp:COMP, prog:PROG};
  Object.keys(cats).forEach(function(cat) {
    var el = document.getElementById("cp-"+cat);
    if (!el) return;
    el.innerHTML = "";
    cats[cat].forEach(function(c) {
      var b = document.createElement("button");
      b.className = "chip " + cat + (sel[c.k] ? " on" : "");
      b.textContent = c.l;
      b.onclick = (function(k,ca){return function(){tog(k,ca);};})(c.k, cat);
      el.appendChild(b);
    });
  });
  var sportEl = document.getElementById("cp-sport");
  if (sportEl && data.sports) {
    sportEl.innerHTML = "";
    data.sports.forEach(function(c) {
      var b = document.createElement("button");
      b.className = "chip sport" + (sel[c.k] ? " on" : "");
      b.textContent = c.l;
      b.onclick = (function(k){return function(){tog(k,"sport");};})(c.k);
      sportEl.appendChild(b);
    });
  }
  renderTags();
}

function tog(k, cat) {
  if (sel[k]) delete sel[k]; else sel[k] = cat;
  renderAll();
}

function renderTags() {
  var keys = Object.keys(sel);
  var fv = document.getElementById("free").value;
  var ft = fv ? fv.split(",").map(function(s){return s.trim();}).filter(Boolean) : [];
  var all = keys.concat(ft);
  var el = document.getElementById("stags");
  if (!all.length) { el.innerHTML='<span style="font-size:12px;color:#aaa;font-style:italic">Aucun</span>'; return; }
  var chips = allChipsList();
  el.innerHTML = all.map(function(k){
    var f = chips.filter(function(c){return c.k===k;})[0];
    return '<span class="stag">'+(f?f.l:k)+'</span>';
  }).join("");
}

// ══════════════════════════════════════════════════════════════════════════════
// GÉNÉRATION
// ══════════════════════════════════════════════════════════════════════════════
function genPhrase(keys, ft, f, Il, il, mat, ri) {
  var gen  = keys.filter(function(k){return sel[k]==="gen";});
  var pos  = keys.filter(function(k){return sel[k]==="pos";});
  var neg  = keys.filter(function(k){return sel[k]==="neg";});
  var comp = keys.filter(function(k){return sel[k]==="comp";});
  var prog = keys.filter(function(k){return sel[k]==="prog";});
  var sport= keys.filter(function(k){return sel[k]==="sport";});
  var compNeg = comp.indexOf("compneg") >= 0;
  var compPos = comp.filter(function(k){return k!=="compneg";});

  // Séparer adjectifs et noms côté positif
  var adjs = [], noms = [];
  pos.concat(gen).forEach(function(k){
    var entry = ADJS[k];
    if (entry) adjs.push(entry[f?1:0]);
    else if (NOMS[k]) noms.push(NOMS[k]);
  });
  compPos.forEach(function(k){
    var entry = ADJS[k];
    if (entry) adjs.push(entry[f?1:0]);
    else if (NOMS[k]) noms.push(NOMS[k]);
  });

  var progL = {prog:"en progrès",progression:"une progression constante",potentiel:"un potentiel à exploiter",encour:"des résultats encourageants",hausse:"un trimestre en hausse",acquis:"des acquis solides"};
  var progNoms = prog.map(function(k){return progL[k]||k;});

  var hasPos = adjs.length + noms.length > 0;
  var hasNeg = neg.length > 0 || compNeg;
  var hasProg = prog.length > 0;

  function joinA(arr) {
    if (!arr.length) return "";
    if (arr.length===1) return arr[0];
    return arr.slice(0,-1).join(", ") + " et " + arr[arr.length-1];
  }
  function joinN(arr) {
    // Joindre des groupes nominaux : "une X, une Y et une Z"
    if (!arr.length) return "";
    if (arr.length===1) return arr[0];
    return arr.slice(0,-1).join(", ") + " et " + arr[arr.length-1];
  }
  function fixElision(s) {
    return s.replace(/de une /g,"d'une ").replace(/de un /g,"d'un ").replace(/de de /g,"de ");
  }

  // Structures positives
  var SP = [
    function(){return "Élève " + joinA(adjs) + (noms.length?", "+Il+" fait preuve de "+joinN(noms):"") + ".";},
    function(){return Il + " se montre " + (adjs.length?joinA(adjs)+" et témoigne":"témoigne") + " de " + (noms.length?joinN(noms):joinA(adjs)) + ".";},
    function(){return "Bon trimestre : " + il + (adjs.length?" est "+joinA(adjs):"") + (noms.length?" et fait preuve de "+joinN(noms):"") + ".";},
    function(){return Il + " se distingue par " + (noms.length?joinN(noms):joinA(adjs)) + ".";},
    function(){return "On retiendra " + (noms.length?joinN(noms):joinA(adjs)+" et un engagement sérieux") + " ce trimestre.";}
  ];
  // Versions simplifiées si seulement adjs ou seulement noms
  var SPA = [
    function(){return "Élève " + joinA(adjs) + ".";},
    function(){return Il + " se montre " + joinA(adjs) + " en cours.";},
    function(){return "Bon trimestre : " + il + " est " + joinA(adjs) + ".";}
  ];
  var SPN = [
    function(){return Il + " fait preuve de " + joinN(noms) + ".";},
    function(){return "On retiendra " + joinN(noms) + " ce trimestre.";},
    function(){return Il + " se distingue par " + joinN(noms) + ".";},
    function(){return "Bon travail : " + il + " témoigne de " + joinN(noms) + ".";}
  ];

  function buildPos() {
    if (adjs.length && noms.length) return fixElision(SP[ri%SP.length]());
    if (adjs.length) return SPA[ri%SPA.length]();
    if (noms.length) return fixElision(SPN[ri%SPN.length]());
    return Il + " participe aux activités.";
  }

  function buildNeg() {
    var phrases = neg.map(function(k){return getNegPhrase(k, ri);});
    if (compNeg) phrases.push("le comportement en cours est à améliorer");
    if (!phrases.length) return "des progrès sont attendus";
    if (phrases.length === 1) return phrases[0];
    return phrases.slice(0,-1).join(", ") + " et " + phrases[phrases.length-1];
  }

  var tr = getTrim();
  var introNeg = {
    T1: ["En ce début d'année, ","Dès ce premier trimestre, ","Pour ce premier trimestre, ","En début d'année, ","À ce stade de l'année, ","Ce premier trimestre montre que "],
    T2: ["À mi-parcours, ","En ce deuxième trimestre, ","Pour ce milieu d'année, ","À mi-année, ","Au cœur de cette année, ","Ce deuxième trimestre montre que "],
    T3: ["En fin d'année, ","Pour ce bilan final, ","À l'issue de cette année, ","En ce troisième trimestre, ","Pour clôturer l'année, ","Ce troisième trimestre montre que "],
    "": ["Ce trimestre, ","Sur ce trimestre, ","Pour cette période, ","Au cours de ce trimestre, ","À ce stade, ","Ce trimestre montre que "]
  };
  var introArr = introNeg[tr] || introNeg[""];
  var liai = ["Cependant, ","Toutefois, ","Il est à noter que ","Un point de vigilance : ","Néanmoins, ","Il faudra veiller à ce que "];

  var conclu = getConclu(hasPos && !hasNeg, ri);
  var isNegOnly = !hasPos && hasNeg;

  var p = "";

  if (hasPos && hasNeg) {
    p = buildPos() + " " + liai[ri%liai.length] + buildNeg() + ". " + conclu;
    if (hasProg && prog.indexOf("potentiel")<0) p += " " + Il + " affiche par ailleurs " + joinN(progNoms) + ".";
  } else if (hasPos) {
    p = buildPos();
    if (hasProg) p += " " + Il + " affiche " + joinN(progNoms) + ". " + conclu;
    else p += " " + conclu;
  } else if (isNegOnly) {
    if (neg.indexOf("perturb") >= 0) {
      var pp = {
        T1: [Il+" perturbe déjà le bon déroulement des cours. Une attitude plus respectueuse est indispensable dès maintenant.",
             "Le comportement de "+il+" est problématique dès ce début d'année. Un changement immédiat est attendu."],
        T2: [Il+" continue de perturber le cours. Cette situation doit impérativement changer au T3.",
             "À mi-parcours, le comportement de "+il+" reste problématique. Une remobilisation est indispensable."],
        T3: ["En fin d'année, le comportement de "+il+" a nui au bon déroulement des cours. Un changement s'imposera l'an prochain.",
             "Ce troisième trimestre confirme un comportement perturbateur. La prochaine rentrée devra être l'occasion d'un vrai changement."],
        "": [Il+" perturbe le bon déroulement des cours. Une attitude plus respectueuse est indispensable.",
             "Le comportement de "+il+" nuit à l'ambiance de travail. Un changement d'attitude est attendu."]
      };
      var ppArr = pp[tr] || pp[""];
      p = ppArr[ri % ppArr.length];
    } else {
      p = introArr[ri%introArr.length] + buildNeg() + ". " + conclu;
    }
    if (hasProg && prog.indexOf("potentiel")>=0) p += " Le potentiel est là, il faut s'en saisir.";
  } else if (compNeg) {
    var cpArr = [Il+" doit revoir son attitude en cours. Des efforts de respect sont attendus.",
                 "Le comportement de "+il+" est à améliorer. Une implication plus positive est souhaitée.",
                 "L'attitude en cours laisse à désirer. Un effort est demandé.",
                 Il+" doit adopter une attitude plus respectueuse et constructive."];
    p = cpArr[ri % cpArr.length];
  } else if (hasProg) {
    if (prog.indexOf("potentiel") >= 0) {
      p = Il+" dispose d'un réel potentiel à exploiter. Avec plus d'implication, les résultats seront au rendez-vous.";
    } else {
      var pi = ["Ce trimestre, "+il+" affiche ","Les résultats témoignent de ","On note "];
      p = fixElision(pi[ri%pi.length] + joinN(progNoms) + ". " + conclu);
    }
  } else {
    p = Il + " participe aux activités. Des marges de progression existent.";
  }

  p = fixElision(p);

  // Préfixe matière (sauf EPS)
  if (mat && mat !== "EPS") {
    p = "En " + mat + ", " + p.charAt(0).toLowerCase() + p.slice(1);
  }

  // Sports cochés
  if (sport.length) {
    var d2 = MAT["EPS"] || {};
    var sportLabels = sport.map(function(k){
      var found = (d2.sports||[]).filter(function(c){return c.k===k;})[0];
      return found ? found.l : k;
    });
    var sportStr = sportLabels.length===1 ? sportLabels[0] : sportLabels.slice(0,-1).join(", ")+" et "+sportLabels[sportLabels.length-1];
    p = p.replace(/\.$/, "") + ", notamment en " + sportStr + ".";
  }

  // Mots libres
  var fv = document.getElementById("free").value;
  var ftArr = fv ? fv.split(",").map(function(s){return s.trim();}).filter(Boolean) : [];
  if (ftArr.length) {
    var profils = ["ulis","segpa","dys","tdah","fragile","blessé","handicap","asthme","dispensé","inclusion","allophone"];
    var isProfil = ftArr.some(function(m){return profils.some(function(pr){return m.toLowerCase().indexOf(pr)>=0;});});
    var ctx = ftArr.join(", ");
    if (isProfil) p = p.replace(/\.$/, "") + " (profil "+ctx+" pris en compte).";
    else p = p.replace(/\.$/, "") + " ("+ctx+").";
  }

  // Limite 255 chars
  if (p.length > 255) p = p.substring(0, 252) + "...";

  return p;
}

function generer() {
  var keys = Object.keys(sel);
  var fv = document.getElementById("free").value;
  var ft = fv ? fv.split(",").map(function(s){return s.trim();}).filter(Boolean) : [];
  if (!keys.length && !ft.length) { alert("Sélectionne au moins un mot-clé."); return; }
  prenomCur = document.getElementById("prenom").value.trim();
  classeCur = document.getElementById("classe").value;
  matCur = document.getElementById("matiere").value;
  var f = genre === "F";
  var Il = prenomCur || (f?"Elle":"Il");
  var il = prenomCur || (f?"elle":"il");
  phrase = genPhrase(keys, ft, f, Il, il, matCur, ri);
  document.getElementById("rz").style.display = "block";
  document.getElementById("ok").style.display = "none";
  document.getElementById("rl").textContent = prenomCur ? "Phrase pour "+prenomCur : "Phrase générée";
  document.getElementById("rt").textContent = phrase;
}
function regenerer() { ri++; generer(); }

function enregistrer() {
  if (!phrase) return;
  var d = DB();
  d.push({id:Date.now(),prenom:prenomCur||"—",classe:classeCur,matiere:matCur,genre:genre,phrase:phrase,date:new Date().toLocaleDateString("fr-FR"),tri:trimAuto(),an:annee()});
  dbS(d); badge(); popAn();
  var b = document.getElementById("ok");
  b.style.display = "block";
  setTimeout(function(){b.style.display="none";}, 2000);
}
function copierPhrase() {
  navigator.clipboard.writeText(phrase).catch(function(){var t=document.createElement("textarea");t.value=phrase;document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);});
}
function resetForm() {
  sel={}; ri=0;
  document.getElementById("prenom").value="";
  document.getElementById("moyenne").value="";
  document.getElementById("moy-lbl").textContent="";
  document.getElementById("trim_sel").value="";
  document.getElementById("free").value="";
  document.getElementById("rz").style.display="none";
  phrase=""; renderAll();
}

// ══════════════════════════════════════════════════════════════════════════════
// LISTE / EXPORT
// ══════════════════════════════════════════════════════════════════════════════
function filtrer(f,btn) {
  filtreCur=f;
  document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("on");});
  btn.classList.add("on"); renderListe();
}
function popAn() {
  var d=DB(); var ans=[];
  d.forEach(function(e){if(e.an&&ans.indexOf(e.an)<0)ans.push(e.an);});
  ans.sort().reverse();
  ["fa","ean"].forEach(function(id){
    var el=document.getElementById(id); if(!el)return;
    el.innerHTML='<option value="t">Toutes années</option>'+ans.map(function(a){return '<option value="'+a+'">'+a+'</option>';}).join("");
  });
}
function renderListe() {
  var d=DB();
  var fm=document.getElementById("fm").value;
  var ft=document.getElementById("ft").value;
  var fa=document.getElementById("fa").value;
  if(filtreCur!=="toutes") d=d.filter(function(e){return e.classe===filtreCur;});
  if(fm!=="t") d=d.filter(function(e){return e.matiere===fm;});
  if(ft!=="t") d=d.filter(function(e){return (e.tri||"T1")===ft;});
  if(fa!=="t") d=d.filter(function(e){return (e.an||"")===fa;});
  document.getElementById("cnt").textContent=d.length+" élève(s)";
  var el=document.getElementById("elist");
  if(!d.length){el.innerHTML='<div class="emp">Aucune appréciation enregistrée.</div>';return;}
  el.innerHTML=d.map(function(e){
    return '<div class="ei"><div class="ein"><div class="en">'+e.prenom+' <span style="font-weight:400;font-size:12px;color:var(--m)">'+e.classe+'</span></div>'
      +'<div class="em">'+(e.tri||"")+" "+(e.an||"")+" · "+(e.matiere||"")+" · "+e.date+'</div>'
      +'<div class="ep">'+e.phrase+'</div></div>'
      +'<div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">'
      +'<button class="ib" onclick="cpItem('+e.id+')">⎘</button>'
      +'<button class="ib d" onclick="delItem('+e.id+')">🗑</button></div></div>';
  }).join("");
}
function cpItem(id){var e=DB().filter(function(x){return x.id===id;})[0];if(e)navigator.clipboard.writeText(e.phrase).catch(function(){});}
function delItem(id){if(!confirm("Supprimer ?"))return;dbS(DB().filter(function(x){return x.id!==id;}));badge();renderListe();renderExp();}
function renderExp() {
  var d=DB();
  if(document.getElementById("ecl").value!=="t") d=d.filter(function(e){return e.classe===document.getElementById("ecl").value;});
  if(document.getElementById("emat").value!=="t") d=d.filter(function(e){return e.matiere===document.getElementById("emat").value;});
  if(document.getElementById("etr").value!=="t") d=d.filter(function(e){return (e.tri||"T1")===document.getElementById("etr").value;});
  if(document.getElementById("ean").value!=="t") d=d.filter(function(e){return (e.an||"")===document.getElementById("ean").value;});
  var el=document.getElementById("ecnt");
  if(!d.length){el.textContent="Aucune appréciation.";return;}
  el.textContent=d.map(function(e){
    return e.prenom+" ("+e.classe+(e.matiere?" · "+e.matiere:"")+(e.tri?" · "+e.tri:"")+(e.an?" "+e.an:"")+")\n"+e.phrase;
  }).join("\n\n");
}
function copierExp(){navigator.clipboard.writeText(document.getElementById("ecnt").textContent).catch(function(){});}
function badge(){var n=DB().length;document.getElementById("bdg").textContent=n?"("+n+")":"";}
function setTab(id){
  document.querySelectorAll(".tab").forEach(function(t,i){t.classList.toggle("on",["gen","lst","exp"][i]===id);});
  document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("on");});
  document.getElementById(id).classList.add("on");
  if(id==="lst"){popAn();renderListe();}
  if(id==="exp"){popAn();renderExp();}
}

// Migration eps_v2 → eps_v3
(function(){
  try{
    var old=localStorage.getItem("eps_v2");
    var cur=localStorage.getItem("eps_v3");
    if(old&&!cur){localStorage.setItem("eps_v3",old);}
    else if(old&&cur){
      var d1=JSON.parse(old)||[],d2=JSON.parse(cur)||[];
      var ids=d2.map(function(x){return x.id;});
      var merged=d2.concat(d1.filter(function(x){return ids.indexOf(x.id)<0;}));
      localStorage.setItem("eps_v3",JSON.stringify(merged));
    }
  }catch(e){}
})();

onMatiere();
badge();
</script>
